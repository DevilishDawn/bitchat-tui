name: Compile armv7 Binary

on:
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install and Configure Cross-Compiler
        run: |
          # Install the official cross compilation utility
          cargo install cross --git https://github.com
          
          # Inject the necessary ARM prerequisites dynamically into the build image
          mkdir -p .cross
          echo '[target.armv7-unknown-linux-gnueabihf.runner]' > Cross.toml
          echo 'prerequisites = ["dpkg --add-architecture armhf", "apt-get update", "apt-get install -y libdbus-1-dev:armhf pkg-config:armhf"]' >> Cross.toml

      - name: Build bitchat-tui via Docker Container
        run: |
          # Compile using cross which handles the target environment safely inside Docker
          cross build --target armv7-unknown-linux-gnueabihf --release

      - name: Upload compiled binary asset
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-tui-armv7
          path: target/armv7-unknown-linux-gnueabihf/release/bitchat-tui
