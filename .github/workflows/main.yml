name: Compile armv7 Static Binary

on:
  workflow_dispatch:

jobs:
  build-armv7-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install Cross utility (Pre-compiled Binary)
        run: |
          # Downloads pre-built binary instantly instead of compiling cross from source
          curl -LLESs https://github.com | tar -xz -C /usr/local/bin

      - name: Build bitchat-tui Static Binary
        run: |
          # Uses cross container environment to build a fully self-contained static binary
          cross build --target armv7-unknown-linux-musleabihf --release

      - name: Upload compiled binary asset
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-tui-kindle-static
          path: target/armv7-unknown-linux-musleabihf/release/bitchat-tui
