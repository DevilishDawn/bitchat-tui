name: Compile armv7 Static Binary

on:
  workflow_dispatch:

jobs:
  build-armv7-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabi

      - name: Install Cross utility
        run: |
          cargo install cross --git https://github.com

      - name: Build bitchat-tui Static Binary
        run: |
          # Use musl target to build a 100% self-contained binary with zero GLIBC dependencies
          cross build --target armv7-unknown-linux-musleabi --release

      - name: Upload compiled binary asset
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-tui-kindle-static
          path: target/armv7-unknown-linux-musleabi/release/bitchat-tui
