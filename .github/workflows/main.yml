name: Compile armv7 Binary

on:
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install ARMv7 cross compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf pkg-config-arm-linux-gnueabihf libdbus-1-dev:armhf

      - name: Build bitchat-tui release binary
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/arm-linux-gnueabihf/pkgconfig"
          OPENSSL_NO_VENDOR: "1"
        run: |
          cargo build --target armv7-unknown-linux-gnueabihf --release

      - name: Upload compiled binary asset
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-tui-armv7
          path: target/armv7-unknown-linux-gnueabihf/release/bitchat-tui
